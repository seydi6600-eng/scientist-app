<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آفلاین — دانشمند</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #e0e7ff);
    padding: 20px;
    direction: rtl;
}
.card {
    max-width: 400px;
    width: 100%;
    background: white;
    border: 4px solid #3b82f6;
    border-radius: 28px;
    padding: 40px 24px;
    text-align: center;
    box-shadow: 0 20px 0 #1e40af, 0 30px 80px rgba(30,64,175,0.3);
}
.emoji {
    font-size: 90px;
    margin-bottom: 20px;
    animation: float 2s ease infinite;
}
@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}
h1 {
    font-size: 24px;
    color: #1e293b;
    margin: 0 0 12px;
    font-weight: 900;
}
p {
    font-size: 14px;
    color: #64748b;
    line-height: 2;
    margin-bottom: 24px;
    font-weight: 700;
}
button {
    width: 100%;
    padding: 16px;
    background: linear-gradient(180deg, #22c55e, #16a34a);
    color: white;
    border: 3px solid #4ade80;
    border-radius: 16px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 5px 0 #14532d;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
}
button:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #14532d;
}
</style>
</head>
<body>
    <div class="card">
        <div class="emoji">📡</div>
        <h1>اتصال اینترنت قطع است</h1>
        <p>
            برای بازی به اینترنت نیاز داری.<br>
            اتصالت رو چک کن و دوباره امتحان کن.
        </p>
        <button onclick="window.location.reload()">
            🔄 تلاش دوباره
        </button>
    </div>
</body>
</html>
