<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشمند</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="topBar" class="top-bar" style="display:none;">
        <div class="currency">
            <img src="images/icons/coin.jpeg" class="currency-img" alt="سکه" onerror="this.style.display='none';this.nextElementSibling.style.display='inline';">
            <span class="currency-icon" style="display:none;">🪙</span>
            <span id="coinsDisplay">۰</span>
            <span class="currency-plus">+</span>
        </div>
        <div class="hearts-mini" id="heartsMiniDisplay">❤️❤️❤️</div>
        <div class="top-bar-title">🧠 دانشمند</div>
        <button id="musicToggleBtn" class="music-toggle-btn" onclick="Music.toggle()">🔊</button>
    </div>

    <div id="categories" class="categories-container"></div>

    <div id="bottomBar" class="bottom-bar" style="display:none;">
        <button class="tab-btn active" data-tab="home" onclick="goTab('home')">
            <span class="tab-icon-fallback" style="display:inline !important; color:#60a5fa; text-shadow: 0 0 12px rgba(96,165,250,0.9), 0 0 20px rgba(96,165,250,0.5); font-size: 34px; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 50%; background: radial-gradient(circle, rgba(96,165,250,0.35), rgba(96,165,250,0.05) 70%); border: 2px solid #60a5fa; box-sizing: border-box;">🏠</span>
            <span class="tab-label">خانه</span>
        </button>
        <button class="tab-btn" data-tab="play" onclick="goTab('play')">
            <img src="images/icons/game.jpeg" class="tab-img" alt="بازی" onerror="this.style.display='none';this.nextElementSibling.style.display='inline';">
            <span class="tab-icon-fallback" style="display:none;">🎮</span>
            <span class="tab-label">بازی</span>
        </button>
        <button class="tab-btn" data-tab="league" onclick="goTab('league')">
            <img src="images/icons/league.jpeg" class="tab-img" alt="لیگ" onerror="this.style.display='none';this.nextElementSibling.style.display='inline';">
            <span class="tab-icon-fallback" style="display:none;">🏆</span>
            <span class="tab-label">لیگ</span>
        </button>
        <button class="tab-btn" data-tab="shop" onclick="goTab('shop')">
            <img src="images/icons/shop.jpeg" class="tab-img" alt="فروشگاه" onerror="this.style.display='none';this.nextElementSibling.style.display='inline';">
            <span class="tab-icon-fallback" style="display:none;">🛒</span>
            <span class="tab-label">فروشگاه</span>
        </button>
        <button class="tab-btn" data-tab="profile" onclick="goTab('profile')">
            <img src="images/icons/profile.jpeg" class="tab-img" alt="پروفایل" onerror="this.style.display='none';this.nextElementSibling.style.display='inline';">
            <span class="tab-icon-fallback" style="display:none;">👤</span>
            <span class="tab-label">پروفایل</span>
        </button>
    </div>

    <!-- ===== اسکریپت‌ها: ترتیب صحیح + defer ===== -->
    
    <!-- ۱. موسیقی (مستقل) -->
    <script src="music.js" defer></script>
    
    <!-- ۲. اسکریپت اصلی — هسته‌ی اپ -->
    <script src="script.js" defer></script>
    
    <!-- ۳. ماژول‌ها — بعد از script.js -->
    <script src="league.js" defer></script>
    <script src="shop.js" defer></script>

</body>
</html>
