<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تست</title>
</head>
<body>
    <h1 id="result">در حال تست...</h1>
    <div id="log"></div>

    <script>
        const log = (msg, color) => {
            const p = document.createElement("p");
            p.textContent = msg;
            p.style.color = color || "black";
            document.getElementById("log").appendChild(p);
        };

        log("۱. HTML لود شد", "blue");

        // تست ۱: آیا music.js لود می‌شه؟
        fetch("music.js")
            .then(r => {
                log("۲. music.js: " + r.status, r.ok ? "green" : "red");
                return r.text();
            })
            .then(t => log("   حجم: " + t.length + " بایت", "gray"))
            .catch(e => log("۲. music.js خطا: " + e.message, "red"));

        // تست ۲: آیا script.js لود می‌شه؟
        fetch("script.js")
            .then(r => {
                log("۳. script.js: " + r.status, r.ok ? "green" : "red");
                return r.text();
            })
            .then(t => log("   حجم: " + t.length + " بایت", "gray"))
            .catch(e => log("۳. script.js خطا: " + e.message, "red"));

        // تست ۳: آیا style.css لود می‌شه؟
        fetch("style.css")
            .then(r => {
                log("۴. style.css: " + r.status, r.ok ? "green" : "red");
                return r.text();
            })
            .then(t => log("   حجم: " + t.length + " بایت", "gray"))
            .catch(e => log("۴. style.css خطا: " + e.message, "red"));

        // تست ۴: آیا فایل‌های JSON سوالات لود می‌شن؟
        fetch("questions/general.json")
            .then(r => {
                log("۵. questions/general.json: " + r.status, r.ok ? "green" : "red");
                return r.text();
            })
            .then(t => log("   حجم: " + t.length + " بایت", "gray"))
            .catch(e => log("۵. general.json خطا: " + e.message, "red"));

        // تست ۵: آیا فایل صدا لود می‌شه؟
        fetch("sounds/main.mp3")
            .then(r => {
                log("۶. sounds/main.mp3: " + r.status, r.ok ? "green" : "red");
            })
            .catch(e => log("۶. main.mp3 خطا: " + e.message, "red"));

        // تست ۶: آیا تصویر لود می‌شه؟
        fetch("images/scientist.png")
            .then(r => {
                log("۷. images/scientist.png: " + r.status, r.ok ? "green" : "red");
            })
            .catch(e => log("۷. scientist.png خطا: " + e.message, "red"));

        // تست ۷: آیا Supabase قابل دسترسیه؟
        fetch("https://aqgacfnbiktutbkgrakq.supabase.co/functions/v1/user-get", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone: "0000000000" })
        })
            .then(r => {
                log("۸. Supabase: " + r.status, r.ok ? "green" : "orange");
                return r.text();
            })
            .then(t => log("   پاسخ: " + t.substring(0, 100), "gray"))
            .catch(e => log("۸. Supabase خطا: " + e.message, "red"));

        log("✅ همه تست‌ها اجرا شدن", "blue");
    </script>
</body>
</html>
